<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Antenna pole -->
  <rect x="15" y="2" width="2" height="2" fill="#B88561"/>
  <!-- Antenna ball -->
  <rect x="14" y="0" width="4" height="2" fill="#FAFAFA"/>
  <rect x="16" y="1" width="2" height="1" fill="#D4D1C9"/>

  <!-- Head body — stepped corners -->
  <rect x="6"  y="6"  width="20" height="1" fill="#FAFAFA"/>
  <rect x="5"  y="7"  width="22" height="1" fill="#FAFAFA"/>
  <rect x="4"  y="8"  width="24" height="16" fill="#EDEDED"/>
  <rect x="4"  y="8"  width="1"  height="16" fill="#FAFAFA"/>
  <rect x="27" y="8"  width="1"  height="16" fill="#D4D1C9"/>
  <rect x="5"  y="24" width="22" height="1" fill="#D4D1C9"/>
  <rect x="6"  y="25" width="20" height="1" fill="#D4D1C9"/>

  <!-- Dark screen -->
  <rect x="7" y="9" width="18" height="14" fill="#1F1A15"/>

  <!-- Eyes — 3×3 pixel blocks -->
  <rect x="10" y="13" width="2" height="2" fill="#F2AD40"/>
  <rect x="12" y="13" width="1" height="2" fill="#F2AD40"/>
  <rect x="10" y="15" width="3" height="1" fill="#F2AD40"/>

  <rect x="19" y="13" width="2" height="2" fill="#F2AD40"/>
  <rect x="21" y="13" width="1" height="2" fill="#F2AD40"/>
  <rect x="19" y="15" width="3" height="1" fill="#F2AD40"/>

  <!-- Mouth — smirk -->
  <rect x="11" y="19" width="2" height="1" fill="#F2AD40"/>
  <rect x="14" y="19" width="2" height="1" fill="#F2AD40"/>
  <rect x="17" y="19" width="2" height="1" fill="#F2AD40"/>
  <rect x="11" y="20" width="1" height="1" fill="#F2AD40"/>
  <rect x="19" y="20" width="1" height="1" fill="#F2AD40"/>
</svg>
